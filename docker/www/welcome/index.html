<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ProxyForge</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(135deg, #0f172a, #1e293b);
    color: #e2e8f0;
    padding: 24px;
  }
  .card {
    max-width: 520px;
    text-align: center;
    padding: 48px 40px;
    border-radius: 16px;
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid rgba(255, 255, 255, 0.08);
  }
  .badge {
    display: inline-block;
    padding: 4px 12px;
    border-radius: 999px;
    background: rgba(99, 102, 241, 0.15);
    color: #a5b4fc;
    font-size: 0.75rem;
    font-weight: 600;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    margin-bottom: 16px;
  }
  h1 { margin: 0 0 12px; font-size: 1.75rem; }
  p { margin: 0 0 8px; color: #94a3b8; line-height: 1.6; }
  code {
    background: rgba(255, 255, 255, 0.06);
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 0.85em;
  }
</style>
</head>
<body>
  <div class="card">
    <span class="badge">ProxyForge</span>
    <h1>It's running.</h1>
    <p>No proxy host matches this request yet.</p>
    <p>Open the dashboard on port <code>81</code> to create your first workflow.</p>
  </div>
</body>
</html>
