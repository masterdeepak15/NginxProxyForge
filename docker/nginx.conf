# Base nginx.conf for the ProxyForge container.
#
# The ProxyForge backend (Node, PID 1 in the container) owns this file's
# lifecycle: it starts nginx with -c pointing here, and every workflow
# deploy runs `nginx -t -c /etc/nginx/nginx.conf` before reloading. Do not
# hand-edit the generated per-workflow fragments under
# /data/nginx/conf.d/{http,stream}/** - those are build artifacts owned by
# the Config Generator. This top-level file is safe to customize.

load_module /usr/lib/nginx/modules/ngx_stream_module.so;

worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Hides the nginx version from error pages and the Server response
    # header (e.g. the "nginx/1.30.4" line on a 404) — applies to every
    # server{} in this file, including all per-workflow generated blocks.
    server_tokens off;

    sendfile        on;
    keepalive_timeout  65;

    client_body_temp_path /tmp/nginx-client-body;
    proxy_temp_path       /tmp/nginx-proxy;
    fastcgi_temp_path     /tmp/nginx-fastcgi;
    uwsgi_temp_path       /tmp/nginx-uwsgi;
    scgi_temp_path        /tmp/nginx-scgi;

    # Custom log format used by every generated per-location access_log
    # directive. $upstream_addr lets metrics.ts attribute individual
    # requests to a specific Backend node when several sit behind one Load
    # Balancer; $request_time gives real per-request latency.
    log_format pf '$remote_addr - $remote_user [$time_local] '
                   '"$request" $status $body_bytes_sent '
                   '"$http_referer" "$http_user_agent" '
                   'up=$upstream_addr rt=$request_time';

    # ACME HTTP-01 challenge fallback - always answered on :80 regardless of
    # which workflow owns the domain, so certificate issuance works even
    # before a workflow's own server block has been deployed. Deliberately
    # NOT marked `default_server`: nginx treats the first server{} for an
    # address:port as the default when none is explicitly marked, so this
    # still serves as the fallback out of the box - but a user's own
    # Default Site node (which does set default_server) correctly takes
    # over once they add one, instead of nginx rejecting the config for a
    # duplicate default_server on :80.
    server {
        listen 80;
        server_name _;

        location /.well-known/acme-challenge/ {
            root /data/acme-webroot;
        }

        location / {
            root /usr/share/proxyforge/welcome;
            index index.html;
        }
    }

    # Admin dashboard - same port convention as Nginx Proxy Manager.
    # Proxies to the two internal Node processes started by
    # docker/entrypoint.sh: the API server (:3001) and the UI/SSR
    # server (:3000). This block lives here (not in conf.d) so workflow
    # deploys can never touch or clobber it.
    server {
        listen 81;
        server_name _;

        location /api/ {
            proxy_pass http://127.0.0.1:3001;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location / {
            proxy_pass http://127.0.0.1:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }

    # Per-workflow server{}/upstream{} blocks generated by ProxyForge.
    include /data/nginx/conf.d/http/*.conf;
}

stream {
    # Per-workflow L4 TCP/UDP server{} blocks generated by ProxyForge.
    include /data/nginx/conf.d/stream/*.conf;
}
