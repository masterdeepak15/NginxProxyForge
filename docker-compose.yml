services:
  proxyforge:
    image: ghcr.io/masterdeepak15/nginxproxyforge:latest
    container_name: proxyforge
    restart: unless-stopped
    ports:
      - "80:80"     # proxied HTTP traffic (real nginx)
      - "443:443"   # proxied HTTPS traffic (real nginx)
      - "81:81"     # admin dashboard (UI + API), same convention as Nginx Proxy Manager
    volumes:
      - ./data:/data
    environment:
      # Set real values in a local .env file (copy .env.example -> .env)
      # before first boot in production - never hardcode secrets in this
      # file, it's tracked in git. Left unset, the account is created as
      # admin@proxyforge.local / changeme (forced to change on first
      # login) - fine for local testing, not for anything reachable outside localhost.
      - ADMIN_EMAIL=admin@proxyforge.local
      - ADMIN_INITIAL_PASSWORD=${ADMIN_INITIAL_PASSWORD:-changeme}
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in a local .env file before running in production}

  # To build locally from source instead of pulling the registry image, swap
  # the `image:` line above for:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile
